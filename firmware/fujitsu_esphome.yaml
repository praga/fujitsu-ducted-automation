substitutions:
  name: "fujitsu-ac"
  friendly_name: "Fujitsu Ducted AC"
  mqtt_broker: "192.168.1.25"
  mqtt_port: "1883"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  output_power: 17.5dBm
  ap:
    ssid: "Fujitsu-AC-Fallback"
    password: "fallbackpassword"

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

web_server:
  port: 80

external_components:
  - source: github://Omniflux/esphome-fujitsu-halcyon

# Hardware UART for LIN Transceiver on ESP32-C3 SuperMini
uart:
  tx_pin: GPIO21
  rx_pin:
    number: GPIO20
    mode:
      input: true
      pullup: true
  baud_rate: 500
  parity: EVEN

ota:
  - platform: esphome
    password: !secret ota_password

climate:
  - platform: fujitsu-halcyon
    name: "Fujitsu Ducted Aircon"
    # 0=Primary (Master wall remote), 1=Secondary (our ESP32 wireless module)
    controller_address: 1
    autoconf: false

mqtt:
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  topic_prefix: fujitsu
  birth_message:
    topic: fujitsu/status
    payload: "online"
  will_message:
    topic: fujitsu/status
    payload: "offline"

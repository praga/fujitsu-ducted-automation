substitutions:
  name: "fujitsu-ac"
  friendly_name: "Fujitsu Ducted AC"
  mqtt_broker: "192.168.1.25"
  mqtt_port: "1883"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi Configuration
wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "Fujitsu-AC-Fallback"
    password: "fallbackpassword"

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

# Web server for direct local web access on the ESP32 itself as backup
web_server:
  port: 80

# External FujiHeatPump Component
# Proven open-source Fujitsu 3-wire bus integration
external_components:
  - source: github://Omniflux/esphome-fujitsu-halcyon@main
    components: [fujitsu_halcyon]

# Hardware UART for MCP2021A LIN Transceiver
uart:
  id: fujitsu_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 500

climate:
  - platform: fujitsu_halcyon
    name: "Fujitsu Ducted Aircon"
    uart_id: fujitsu_uart
    # Configured as Secondary controller to work in parallel with your UTY-RVNYM wall remote
    controller_type: secondary
    visual:
      min_temperature: 16.0
      max_temperature: 30.0
      temperature_step: 0.5

# Mosquitto MQTT Connection (192.168.1.25)
mqtt:
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  topic_prefix: fujitsu
  birth_message:
    topic: fujitsu/status
    payload: "online"
  will_message:
    topic: fujitsu/status
    payload: "offline"

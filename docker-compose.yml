version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fujitsu-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    entrypoint: >
      sh -c "
        mkdir -p /mosquitto/config /mosquitto/data /mosquitto/log &&
        echo 'listener 1883 0.0.0.0' > /mosquitto/config/mosquitto.conf &&
        echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
        echo 'listener 9001 0.0.0.0' >> /mosquitto/config/mosquitto.conf &&
        echo 'protocol websockets' >> /mosquitto/config/mosquitto.conf &&
        echo 'persistence true' >> /mosquitto/config/mosquitto.conf &&
        echo 'persistence_location /mosquitto/data/' >> /mosquitto/config/mosquitto.conf &&
        /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      "
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur

  aircon-webapp:
    image: python:3.11-slim
    container_name: fujitsu-aircon-webapp
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8188:8085"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC_PREFIX=fujitsu
      - SIMULATE_AC=true
    volumes:
      - fujitsu-app-repo:/app/repo
      - fujitsu-app-data:/app/data
    command: >
      sh -c "
        apt-get update && apt-get install -y --no-install-recommends git curl &&
        mkdir -p /app/repo &&
        if [ ! -d /app/repo/.git ]; then
          find /app/repo -mindepth 1 -delete 2>/dev/null || true
          git clone https://github.com/praga/fujitsu-ducted-automation.git /app/repo
        else
          cd /app/repo && git fetch origin main && git reset --hard origin/main
        fi &&
        cd /app/repo &&
        pip install --no-cache-dir -r backend/requirements.txt &&
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8085
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mosquitto-data:
  mosquitto-log:
  fujitsu-app-repo:
  fujitsu-app-data:
